name: Build Pixiv source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
          toolchain: '1.99.1'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt -p aidoku-pixiv --check
      - run: cargo clippy --release --locked -- -D warnings
      - run: cargo test --lib --release --target x86_64-unknown-linux-gnu --locked
      - run: cargo build --release --locked
      - run: node tests/wasm-auth.mjs
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify.py
      - run: cargo fetch --locked
      - run: python scripts/licenses.py
      - run: python scripts/package.py
      - run: python scripts/build_list.py
      - uses: actions/upload-artifact@v4
        with:
          name: Pixiv-source
          path: dist/Pixiv.aix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: source-list
          path: public/
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: source-list
          path: public
      - name: Publish source list
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: public
          commit-message: 'chore: update Pixiv source list'
